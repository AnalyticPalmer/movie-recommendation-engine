[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recommendation-engine"
version = "1.0.0"
description = "Movie recommendation engine using popularity, content-based, collaborative filtering, and hybrid recommendation models."
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]